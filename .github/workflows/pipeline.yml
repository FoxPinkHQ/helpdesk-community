name: pipeline

# FoxPink publishing pipeline — the Audit stage is a MANDATORY gate.
# See docs/publisher/PIPELINE.md. Consistency (this) runs on every push/PR;
# correctness (tests / render-smoke) is the Validate stage (local Docker for now).

on:
  push:
    branches: ["14.0", "15.0", "16.0", "17.0", "18.0", "19.0"]
  pull_request:
    branches: ["14.0", "15.0", "16.0", "17.0", "18.0", "19.0"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit gate (MetadataPass + ResearchPass + canonical knowledge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all series refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pipeline audit (fail-closed)
        run: python ci/pipeline_audit.py --ref-prefix origin/
